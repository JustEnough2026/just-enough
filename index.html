<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315746">
  <meta name="description" content="食材有限 Just Enough 線上點餐">
  <title>食材有限 Just Enough｜線上點餐</title>
  <link rel="stylesheet" href="styles.css?v=15.0.0">
  <script defer src="config.js?v=15.0.0"></script>
  <script defer src="app.js?v=15.0.0"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>食材有限</strong><span>Just Enough</span></div>
  <div id="open-status" class="status"></div>
</header>

<main>
  <section class="hero"><img src="hero.jpg" alt="食材有限餐點合照"></section>
  <section class="quick-links" aria-label="店家連結">
    <a id="line-link" class="quick-link important" target="_blank" rel="noopener"><strong>LINE 社群</strong><small>密碼：0000</small></a>
    <a id="map-link" class="quick-link" target="_blank" rel="noopener"><strong>導航取餐</strong><small>正強街200號</small></a>
    <a id="foodpanda-link" class="quick-link optional" target="_blank" rel="noopener">Foodpanda</a>
    <a id="uber-link" class="quick-link optional" target="_blank" rel="noopener">Uber Eats</a>
  </section>

  <section id="menu" class="section-block">
    <div class="section-heading"><div><h2>餐點</h2></div></div>
    <div id="product-list" class="products"></div>
    <p class="food-note">圖片僅供參考，請以實品為主。部分餐點含花生、芝麻，堅果過敏者請留意。</p>
  </section>

  <section class="order-form card section-block">
    <div class="section-heading"><div><h2>取餐資料</h2></div></div>
    <div class="form-grid">
      <label><span>取餐人姓名</span><input id="customer-name" autocomplete="name" placeholder="請輸入姓名"></label>
      <label><span>取餐日期</span><input id="pickup-date" type="date"></label>
      <label><span>取餐時間</span><input id="pickup-time" type="time"></label>
    </div>

    <div class="field-group">
      <div class="field-title">餐具 <small>請選一個</small></div>
      <div class="utensils">
        <button type="button" data-utensil="⭕️ 餐具">⭕️ 餐具</button>
        <button type="button" data-utensil="❌ 餐具">❌ 餐具</button>
      </div>
    </div>

    <label class="note-label"><span>備註</span><textarea id="note" rows="3" placeholder="例如：不要香菜、少辣"></textarea></label>
  </section>

  <section class="info card">
    <p><strong>取餐地址</strong><span id="info-address"></span></p>
    <p><strong>LINE 密碼</strong><span>0000</span></p>
  </section>
</main>

<div class="cart-bar" id="cart-bar">
  <div class="cart-summary"><span id="cart-count">0 份</span><strong id="cart-total">$0</strong></div>
  <button id="open-cart">查看訂單</button>
</div>

<div id="cart-sheet" class="sheet" aria-hidden="true">
  <div class="sheet-panel">
    <button class="close" id="close-cart" aria-label="關閉">×</button>
    <h2>確認您的訂單</h2>
    <div id="cart-items" class="cart-items"></div>
    <div class="total-row"><span>總金額</span><strong id="sheet-total">$0</strong></div>
    <p class="line-hint">確認後開啟 LINE 傳送訂單。<br>LINE 密碼：<b>0000</b></p>
    <button id="back-order" class="secondary full" type="button">← 回上一步</button>
    <button id="send-line" class="primary full">開啟 LINE 傳送訂單</button>
  </div>
</div>
</body>
</html>
